name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # every day at 00:00 Bangladesh time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-3d.yml, .github/actions/profile-3d-contrib/**]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      # Local copy of yoshi389111/github-profile-3d-contrib v0.9.3 (MIT), patched to show every
      # detected language with its % share and no "other" slice. See .github/actions/profile-3d-contrib.
      - uses: ./.github/actions/profile-3d-contrib
        env:
          # Add a repo secret named PROFILE_3D_TOKEN (classic PAT) to include private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_3D_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "Update 3D contribution graph"; then
            git pull --rebase origin main
            git push
          fi
